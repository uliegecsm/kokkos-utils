name: Build and test

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
    workflow_dispatch:
    schedule:
        # As advised by https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule,
        # let's start the scheduled action at a somewhat random time to avoid periods of high load.
        - cron: '42 5 * * 3'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    REGISTRY: ghcr.io

jobs:

    set-vars-and-skips:
        runs-on: ubuntu-latest
        outputs:
            CI_IMAGE : ${{ steps.common.outputs.CI_IMAGE }}
            build-images: ${{ steps.build-images.outputs.build-images }}
        steps:
            - name: Export common variables.
              id  : common
              run : |
                  echo "CI_IMAGE=${{ env.REGISTRY }}/${{ github.repository }}/kokkos-utils" >> $GITHUB_OUTPUT

            - uses: actions/checkout@v6

            # For the 'build-images' job.
            - id: build-images-changed-files
              uses: tj-actions/changed-files@v47.0.5
              with:
                  files: |
                      .github/**
                      cmake/presets/**
                      docker/dockerfile.builder
                      requirements/**
                      version.json

            - id: build-images
              env:
                  ANY_CHANGED: ${{ steps.build-images-changed-files.outputs.any_changed == 'true' }}
              run: |
                  if [ "$ANY_CHANGED" = "true" ]; then
                      BUILD_IMAGES=true
                  else
                      BUILD_IMAGES=false
                  fi
                  echo "BUILD_IMAGES set to ${BUILD_IMAGES} because:"
                  echo "    - any changed: ${ANY_CHANGED}"
                  echo "build-images=${BUILD_IMAGES}" >> $GITHUB_OUTPUT

    build-images-image:
        needs: [set-vars-and-skips]
        if: ${{ needs.set-vars-and-skips.outputs.build-images == 'true' }}
        runs-on: ubuntu-latest
        container:
            image: docker:latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v6

            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/setup-qemu-action@v3

            - uses: docker/setup-buildx-action@v3

            - uses: docker/build-push-action@v7
              with:
                  context: null
                  platforms: linux/amd64,linux/arm64
                  push: ${{ github.ref == 'refs/heads/develop' }}
                  file: docker/dockerfile.build-images
                  tags: ghcr.io/${{ github.repository }}/build-images:latest
                  cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/build-images:latest
                  cache-to: type=inline
                  labels: "org.opencontainers.image.source=${{ github.repositoryUrl }}"

    build-images:
        needs: [set-vars-and-skips, build-images-image]
        if: ${{ needs.set-vars-and-skips.outputs.build-images == 'true' }}
        runs-on: ${{ matrix.runs-on }}
        container:
            image: ghcr.io/${{ github.repository }}/build-images:latest
        services:
            docker:
                image: docker:dind
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - backend        : Cuda
                      compiler_family: gcc
                      base_image     : nvcr.io/nvidia/cuda:13.1.0-devel-ubuntu24.04
                      tag_suffix     : -13.1.0
                      platforms      : linux/amd64
                      kokkos_arch    : BLACKWELL120
                      runs-on        : ubuntu-latest
                    - backend        : HIP
                      compiler_family: rocm
                      base_image     : rocm/dev-ubuntu-24.04:6.4.3
                      tag_suffix     : -6.4.3
                      platforms      : linux/amd64
                      kokkos_arch    : AMD_GFX906
                      runs-on        : ubuntu-latest
                    - backend        : OpenMP
                      compiler_family: gcc
                      base_image     : ubuntu:24.04
                      platforms      : linux/amd64
                      tag_suffix     : -amd64
                      runs-on        : ubuntu-latest
                    - backend        : OpenMP
                      compiler_family: gcc
                      base_image     : ubuntu:24.04
                      platforms      : linux/arm64
                      runs-on        : ubuntu-24.04-arm
                      tag_suffix     : -arm64
                    - backend        : OpenMP
                      compiler_family: clang
                      base_image     : ubuntu:24.04
                      platforms      : linux/amd64
                      runs-on        : ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  set-safe-directory: true

            - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Prepare.
              run : |
                  echo "CMAKE_VERSION=$(     jq .dependencies.cmake.value      version.json -j)" >> $GITHUB_ENV
                  echo "DOXYGEN_VERSION=$(   jq .dependencies.doxygen.value    version.json -j)" >> $GITHUB_ENV
                  echo "GOOGLETEST_VERSION=$(jq .dependencies.googletest.value version.json -j)" >> $GITHUB_ENV
                  echo "KOKKOS_SHA=$(        jq .dependencies.kokkos.sha       version.json -j)" >> $GITHUB_ENV

            - name: Set up Docker Buildx.
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry.
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push.
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: ${{ matrix.platforms }}
                  push: ${{ github.ref == 'refs/heads/develop' }}
                  file: docker/dockerfile
                  tags: ${{ needs.set-vars-and-skips.outputs.CI_IMAGE }}:${{ matrix.compiler_family }}-${{ matrix.backend }}${{ matrix.tag_suffix }}
                  cache-from: type=registry,ref=${{ needs.set-vars-and-skips.outputs.CI_IMAGE }}:${{ matrix.compiler_family }}-${{ matrix.backend }}${{ matrix.tag_suffix }}
                  cache-to: type=inline
                  target: final
                  build-args: |
                      BASE_IMAGE=${{ matrix.base_image }}
                      CMAKE_VERSION=${{ env.CMAKE_VERSION }}
                      COMPILER_FAMILY=${{ matrix.compiler_family }}
                      DOXYGEN_VERSION=${{ env.DOXYGEN_VERSION }}
                      GOOGLETEST_VERSION=${{ env.GOOGLETEST_VERSION }}
                      KOKKOS_ARCH=${{ matrix.kokkos_arch }}
                      KOKKOS_PRESET=${{ matrix.compiler_family }}-${{ matrix.backend }}
                      KOKKOS_SHA=${{ env.KOKKOS_SHA }}
                  labels: "org.opencontainers.image.source=${{ github.repositoryUrl }}"

    finalize-images:
        needs: [set-vars-and-skips, build-images]
        if: ${{ needs.set-vars-and-skips.outputs.build-images == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            packages: write
        container:
            image: docker:latest
        services:
            docker:
                image: docker:dind
        strategy:
            fail-fast: false
            matrix:
                include:
                    - backend        : OpenMP
                      compiler_family: gcc
        steps:
            - uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - run: |
                docker buildx imagetools create \
                    --tag=${{ needs.set-vars-and-skips.outputs.CI_IMAGE }}:${{ matrix.compiler_family }}-${{ matrix.backend }}${{ matrix.tag_suffix }} \
                    ${{ needs.set-vars-and-skips.outputs.CI_IMAGE }}:${{ matrix.compiler_family }}-${{ matrix.backend }}${{ matrix.tag_suffix }}-amd64 \
                    ${{ needs.set-vars-and-skips.outputs.CI_IMAGE }}:${{ matrix.compiler_family }}-${{ matrix.backend }}${{ matrix.tag_suffix }}-arm64

    build-library-and-test:
        needs: [set-vars-and-skips, finalize-images]
        runs-on: ${{ matrix.runs-on }}
        if: ${{ ! failure() && ! cancelled() }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - backend        : Cuda
                      compiler_family: gcc
                      runs-on        : [self-hosted, linux, amd64, docker, cuda, blackwell120]
                      tag_suffix     : -13.1.0
                      platform       : linux/amd64
                    - backend        : HIP
                      compiler_family: rocm
                      runs-on        : [self-hosted, linux, amd64, docker, rocm, amd_gfx906]
                      tag_suffix     : -6.4.3
                      platform       : linux/amd64
                      options        : --device /dev/kfd --device /dev/dri
                    - backend        : OpenMP
                      compiler_family: gcc
                      runs-on        : ubuntu-24.04
                      platform       : linux/amd64
                    - backend        : OpenMP
                      compiler_family: gcc
                      runs-on        : ubuntu-24.04-arm
                      platform       : linux/arm64
                    - backend        : OpenMP
                      compiler_family: clang
                      runs-on        : ubuntu-latest
                      platform       : linux/amd64
        container:
            image: ${{ needs.set-vars-and-skips.outputs.CI_IMAGE }}:${{ matrix.compiler_family }}-${{ matrix.backend }}${{ matrix.tag_suffix }}
            options: --platform=${{ matrix.platform }} ${{ matrix.options }}
        steps:
            - uses: actions/checkout@v6

            - name: Configure and build.
              run : |
                  cmake -S .    --preset=${{ matrix.compiler_family }}-${{ matrix.backend }} --warn-uninitialized -Werror=dev
                  cmake --build --preset=${{ matrix.compiler_family }}-${{ matrix.backend }} -j$(($(nproc) > 4 ? 4 : $(nproc)))

            - name: Test.
              run : |
                  ctest --preset=${{ matrix.compiler_family }}-${{ matrix.backend }}

            - name: Test install.
              run : |
                  bash tests/install.sh ${{ matrix.compiler_family }}-${{ matrix.backend }}

            - name: Test find package after install.
              run : |
                  KOKKOS_UTILS_VERSION=$(python3 -c 'import json; print(json.load(open("version.json"))["kokkos-utils"]["value"])')

                  test -d include/
                  rm -rf include/

                  bash tests/find_package.sh "${{ matrix.compiler_family }}" "${KOKKOS_UTILS_VERSION}"

    build-documentation:
        needs: [set-vars-and-skips, finalize-images]
        if: ${{ ! failure() && ! cancelled() }}
        runs-on: [ubuntu-latest]
        container:
            image: ${{ needs.set-vars-and-skips.outputs.CI_IMAGE }}:gcc-OpenMP
        steps:
            - uses: actions/checkout@v6

            - name: Build Doxygen documentation.
              run : |
                  cmake -S .    --preset=gcc-OpenMP --warn-uninitialized -Werror=dev
                  cmake --build --preset=gcc-OpenMP --target=docs

            - name: Check tag file.
              run : |
                  python3 tests/check_tag_file.py --tag-file=$PWD/build-with-gcc-OpenMP/docs/html/kokkos-utils.tag

            - uses: actions/upload-pages-artifact@v4
              with:
                  path: build-with-gcc-OpenMP/docs/html

    # The deploy job is heavily inspired from https://github.com/actions/deploy-pages.
    deploy:
        # The deployment only happens if the library can be built and the documentation generated.
        needs: [build-library-and-test, build-documentation]
        runs-on: [ubuntu-latest]

        # The deployment only happens for 'main' or 'develop' branch.
        if: ${{ ! failure() && ! cancelled() && contains(fromJSON('["refs/heads/main", "refs/heads/develop"]'), github.ref) }}

        # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
        permissions:
            pages: write      # to deploy to Pages
            id-token: write   # to verify the deployment originates from an appropriate source

        # Deploy to the github-pages environment
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages.
              id  : deployment
              uses: actions/deploy-pages@v4
