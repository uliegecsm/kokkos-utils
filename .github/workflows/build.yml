name: Build and test

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
    workflow_dispatch:
    schedule:
        # As advised by https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule,
        # let's start the scheduled action at a somewhat random time to avoid periods of high load.
        - cron: '42 5 * * 3'

env:
    REGISTRY: ghcr.io

jobs:

    set-vars:
        runs-on: [ubuntu-latest]
        outputs:
            CI_IMAGE : ${{ steps.common.outputs.CI_IMAGE }}
        steps:
            - name: Export common variables.
              id  : common
              run : |
                  echo "CI_IMAGE=${{ env.REGISTRY }}/${{ github.repository }}/kokkos-utils" >> $GITHUB_OUTPUT

    build-image:
        needs: [set-vars]
        runs-on: [ubuntu-latest]
        container:
            image: docker:latest
        permissions:
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - backend        : Cuda
                      compiler_family: gcc
                      base_image     : nvidia/cuda:12.9.0-devel-ubuntu24.04
                      tag_suffix     : -12.9.0
                      platforms      : linux/amd64
                      kokkos_arch    : BLACKWELL120
                    - backend        : HIP
                      compiler_family: rocm
                      base_image     : rocm/dev-ubuntu-24.04:6.4
                      tag_suffix     : -6.4
                      platforms      : linux/amd64
                      kokkos_arch    : AMD_GFX906
                    - backend        : OpenMP
                      compiler_family: gcc
                      base_image     : ubuntu:24.04
                      platforms      : linux/amd64,linux/arm64
                    - backend        : OpenMP
                      compiler_family: clang
                      base_image     : ubuntu:24.04
                      platforms      : linux/amd64
        steps:
            - uses: actions/checkout@v4
              with:
                  set-safe-directory: true

            - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - id: changed-files
              uses: tj-actions/changed-files@v46.0.5
              with:
                  files: |
                      .github/**
                      cmake/presets/**
                      docker/dockerfile.builder
                      requirements/**
                      version.json

            - name: Prepare.
              if  : steps.changed-files.outputs.any_changed == 'true'
              run : |
                  apk add jq

                  echo "CMAKE_VERSION=$(     jq .dependencies.cmake.value      version.json -j)" >> $GITHUB_ENV
                  echo "DOXYGEN_VERSION=$(   jq .dependencies.doxygen.value    version.json -j)" >> $GITHUB_ENV
                  echo "GOOGLETEST_VERSION=$(jq .dependencies.googletest.value version.json -j)" >> $GITHUB_ENV
                  echo "KOKKOS_VERSION=$(    jq .dependencies.kokkos.value     version.json -j)" >> $GITHUB_ENV

            - name: Set up QEMU.
              if  : steps.changed-files.outputs.any_changed == 'true'
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx.
              if  : steps.changed-files.outputs.any_changed == 'true'
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry.
              if  : steps.changed-files.outputs.any_changed == 'true'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push.
              if  : steps.changed-files.outputs.any_changed == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: ${{ matrix.platforms }}
                  push: ${{ github.ref == 'refs/heads/develop' }}
                  file: docker/dockerfile
                  tags: ${{ needs.set-vars.outputs.CI_IMAGE }}:${{ matrix.compiler_family }}-${{ matrix.backend }}${{ matrix.tag_suffix }}
                  cache-from: type=registry,ref=${{ needs.set-vars.outputs.CI_IMAGE }}:${{ matrix.compiler_family }}-${{ matrix.backend }}${{ matrix.tag_suffix }}
                  cache-to: type=inline
                  target: final
                  build-args: |
                      BASE_IMAGE=${{ matrix.base_image }}
                      CMAKE_VERSION=${{ env.CMAKE_VERSION }}
                      COMPILER_FAMILY=${{ matrix.compiler_family }}
                      DOXYGEN_VERSION=${{ env.DOXYGEN_VERSION }}
                      GOOGLETEST_VERSION=${{ env.GOOGLETEST_VERSION }}
                      KOKKOS_ARCH=${{ matrix.kokkos_arch }}
                      KOKKOS_PRESET=${{ matrix.compiler_family }}-${{ matrix.backend }}
                      KOKKOS_VERSION=${{ env.KOKKOS_VERSION }}
                  labels: "org.opencontainers.image.source=${{ github.repositoryUrl }}"

    build-library-and-test:
        needs: [set-vars, build-image]
        runs-on: ${{ matrix.runs_on || 'ubuntu-latest' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - backend        : Cuda
                      compiler_family: gcc
                      runs_on        : [self-hosted, linux, amd64, docker, cuda, blackwell120]
                      tag_suffix     : -12.9.0
                    - backend        : HIP
                      compiler_family: rocm
                      runs_on        : [self-hosted, linux, amd64, docker, rocm, amd_gfx906]
                      tag_suffix     : -6.4
                      options        : --device /dev/kfd --device /dev/dri
                    - backend        : OpenMP
                      compiler_family: gcc
                    - backend        : OpenMP
                      compiler_family: clang
        container:
            image: ${{ needs.set-vars.outputs.CI_IMAGE }}:${{ matrix.compiler_family }}-${{ matrix.backend }}${{ matrix.tag_suffix }}
            options: --platform=linux/amd64 ${{ matrix.options }}
        steps:
            - uses: actions/checkout@v4

            - name: Configure and build.
              run : |
                  cmake -S .    --preset=${{ matrix.compiler_family }}-${{ matrix.backend }} --warn-uninitialized -Werror=dev
                  cmake --build --preset=${{ matrix.compiler_family }}-${{ matrix.backend }} -j$(($(nproc) > 4 ? 4 : $(nproc)))

            - name: Test.
              run : |
                  ctest --preset=${{ matrix.compiler_family }}-${{ matrix.backend }}

            - name: Test install.
              run : |
                  bash tests/install.sh ${{ matrix.compiler_family }}-${{ matrix.backend }}

            - name: Test find package after install.
              run : |
                  test -d include/
                  rm -rf include/

                  bash tests/find_package.sh ${{ matrix.compiler_family }}

    build-documentation:
        needs: [set-vars, build-image]
        runs-on: [ubuntu-latest]
        container:
            image: ${{ needs.set-vars.outputs.CI_IMAGE }}:gcc-OpenMP
        steps:
            - uses: actions/checkout@v4

            - name: Build Doxygen documentation.
              run : |
                  cmake -S .    --preset=gcc-OpenMP --warn-uninitialized -Werror=dev
                  cmake --build --preset=gcc-OpenMP --target=docs

            - name: Check tag file.
              run : |
                  python3 tests/check_tag_file.py --tag-file=$PWD/build-with-gcc-OpenMP/docs/html/kokkos-utils.tag

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: build-with-gcc-OpenMP/docs/html

    # The deploy job is heavily inspired from https://github.com/actions/deploy-pages.
    deploy:
        # The deployment only happens if the library can be built and the documentation generated.
        needs: [build-library-and-test, build-documentation]
        runs-on: [ubuntu-latest]

        # The deployment only happens for 'main' or 'develop' branch.
        if: ${{ contains(fromJSON('["refs/heads/main", "refs/heads/develop"]'), github.ref) }}

        # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
        permissions:
            pages: write      # to deploy to Pages
            id-token: write   # to verify the deployment originates from an appropriate source

        # Deploy to the github-pages environment
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages.
              id  : deployment
              uses: actions/deploy-pages@v4
